<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>🍔 Teste AR — Hambúrguer em tamanho real</title>
<style>
  :root{
    --bg-0:#141110;
    --bg-1:#1c1815;
    --ink-0:#f4ece1;
    --ink-1:#c9bcae;
    --accent:#e3672b;
    --line: rgba(244,236,225,0.14);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg-0:#f4ece1;
      --bg-1:#ffffff;
      --ink-0:#1c1815;
      --ink-1:#5a4f45;
      --line: rgba(28,24,21,0.12);
    }
  }
  :root[data-theme="dark"]{
    --bg-0:#141110; --bg-1:#1c1815; --ink-0:#f4ece1; --ink-1:#c9bcae; --line: rgba(244,236,225,0.14);
  }
  :root[data-theme="light"]{
    --bg-0:#f4ece1; --bg-1:#ffffff; --ink-0:#1c1815; --ink-1:#5a4f45; --line: rgba(28,24,21,0.12);
  }

  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%;
    background: var(--bg-0);
    color: var(--ink-0);
    font-family: 'Iowan Old Style','Georgia',ui-serif,serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  #app { position: fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action: none; }

  header.top {
    position: fixed; top:0; left:0; right:0;
    padding: 18px 20px 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
    z-index: 5;
    pointer-events: none;
  }
  header.top h1 {
    margin:0; font-size: 1.15rem; font-weight: 600; letter-spacing: 0.01em;
    color: #f4ece1;
  }
  header.top p {
    margin: 4px 0 0; font-size: 0.82rem; color: #d9cdbe; font-family: -apple-system, system-ui, sans-serif;
    max-width: 32ch;
  }

  #panel {
    position: fixed; left:0; right:0; bottom:0;
    z-index: 6;
    padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg-1) 55%, transparent);
    display:flex; flex-direction: column; gap: 10px; align-items: center;
    text-align: center;
    font-family: -apple-system, system-ui, sans-serif;
  }
  #panel .msg { font-size: 0.86rem; color: var(--ink-1); max-width: 42ch; line-height: 1.4; }
  #panel .msg b { color: var(--ink-0); }

  button.cta {
    appearance: none; border: none; cursor: pointer;
    padding: 13px 26px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff8f2;
    font-size: 0.95rem; font-weight: 600;
    font-family: -apple-system, system-ui, sans-serif;
    box-shadow: 0 6px 18px rgba(227,103,43,0.35);
  }
  button.cta:active { transform: scale(0.97); }
  button.cta:disabled { opacity: 0.45; cursor: default; }

  #reset-btn {
    position: fixed; top: 18px; right: 16px; z-index: 6;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(20,17,16,0.55);
    color: #f4ece1;
    display:none;
    align-items:center; justify-content:center;
    font-size: 1.1rem;
    backdrop-filter: blur(6px);
  }

  #hint {
    position: fixed; left:50%; top: 46%; transform: translate(-50%,-50%);
    z-index: 4;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(20,17,16,0.55);
    color: #f4ece1;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 0.8rem;
    display:none;
    backdrop-filter: blur(6px);
  }

  .dot {
    position: fixed; z-index: 1;
  }
</style>
</head>
<body>

<div id="app"></div>

<header class="top">
  <h1>🍔 Hambúrguer — teste de escala real</h1>
  <p>Modelo 3D genérico, montado a partir de formas simples, nas dimensões aproximadas de um lanche de fast-food.</p>
</header>

<div id="hint">Aponte para uma superfície plana e toque para posicionar</div>
<button id="reset-btn" aria-label="Reposicionar">↺</button>

<div id="panel">
  <div class="msg" id="msg">Carregando o visualizador…</div>
  <button class="cta" id="main-btn" disabled>Aguarde…</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ARButton } from 'three/addons/webxr/ARButton.js';

const app = document.getElementById('app');
const msg = document.getElementById('msg');
const mainBtn = document.getElementById('main-btn');
const resetBtn = document.getElementById('reset-btn');
const hint = document.getElementById('hint');

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 20);
camera.position.set(0.18, 0.16, 0.22);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Lighting ----------
const hemi = new THREE.HemisphereLight(0xfff2e0, 0x2b2118, 1.1);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 1.4);
dir.position.set(0.5, 1, 0.3);
scene.add(dir);
const fill = new THREE.DirectionalLight(0xffe3c4, 0.5);
fill.position.set(-0.6, 0.4, -0.4);
scene.add(fill);

// ---------- Build a generic burger (real-world meters) ----------
function roundedCylinder(radiusTop, radiusBottom, height, color, segments = 32) {
  const geo = new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments, 1, false);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.02 });
  return new THREE.Mesh(geo, mat);
}

function buildBurger() {
  const burger = new THREE.Group();
  let y = 0;

  // Bottom bun (squat cylinder, slightly domed underside look via wide radius)
  const bottomBunH = 0.022;
  const bottomBun = roundedCylinder(0.05, 0.046, bottomBunH, 0xd9a05b);
  bottomBun.position.y = y + bottomBunH / 2;
  burger.add(bottomBun);
  y += bottomBunH;

  // Lettuce (thin wavy-ish disc, wider than bun so it peeks out)
  const lettuceH = 0.008;
  const lettuce = roundedCylinder(0.056, 0.056, lettuceH, 0x6fa83e, 24);
  lettuce.position.y = y + lettuceH / 2;
  burger.add(lettuce);
  y += lettuceH;

  // Tomato slice
  const tomatoH = 0.008;
  const tomato = roundedCylinder(0.05, 0.05, tomatoH, 0xc23b2b, 24);
  tomato.position.y = y + tomatoH / 2;
  burger.add(tomato);
  y += tomatoH;

  // Patty
  const pattyH = 0.016;
  const patty = roundedCylinder(0.048, 0.048, pattyH, 0x5a3a28, 28);
  patty.position.y = y + pattyH / 2;
  burger.add(patty);
  y += pattyH;

  // Cheese (thin square-ish drape — use a box rotated 45°)
  const cheeseGeo = new THREE.BoxGeometry(0.095, 0.006, 0.095);
  const cheeseMat = new THREE.MeshStandardMaterial({ color: 0xf2c14e, roughness: 0.6 });
  const cheese = new THREE.Mesh(cheeseGeo, cheeseMat);
  cheese.rotation.y = Math.PI / 4;
  cheese.position.y = y + 0.003;
  burger.add(cheese);
  y += 0.008;

  // Top bun: cylinder + sphere cap for a domed look
  const topBunH = 0.028;
  const topBunBase = roundedCylinder(0.052, 0.05, topBunH, 0xe0a856, 32);
  topBunBase.position.y = y + topBunH / 2;
  burger.add(topBunBase);

  const domeGeo = new THREE.SphereGeometry(0.052, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
  const domeMat = new THREE.MeshStandardMaterial({ color: 0xe0a856, roughness: 0.8 });
  const dome = new THREE.Mesh(domeGeo, domeMat);
  dome.position.y = y + topBunH;
  burger.add(dome);

  // Sesame seeds scattered on dome
  const seedGeo = new THREE.SphereGeometry(0.0022, 8, 8);
  const seedMat = new THREE.MeshStandardMaterial({ color: 0xfaf1d8, roughness: 0.5 });
  for (let i = 0; i < 22; i++) {
    const seed = new THREE.Mesh(seedGeo, seedMat);
    const theta = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.042;
    seed.position.set(
      Math.cos(theta) * r,
      y + topBunH + Math.sqrt(Math.max(0, 0.052 * 0.052 - r * r)) * 0.9,
      Math.sin(theta) * r
    );
    seed.rotation.set(Math.random(), Math.random(), Math.random());
    burger.add(seed);
  }

  y += topBunH + 0.052;

  burger.userData.totalHeight = y;
  return burger;
}

// ---------- Desktop / non-AR preview mode ----------
let controls = null;
let previewBurger = null;

function setupPreview() {
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.05, 0);
  controls.enableDamping = true;
  controls.minDistance = 0.12;
  controls.maxDistance = 0.6;
  camera.lookAt(0, 0.05, 0);

  // Reference plate (10 cm radius disc) so scale reads clearly
  const plateGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.004, 48);
  const plateMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 });
  const plate = new THREE.Mesh(plateGeo, plateMat);
  plate.position.y = -0.002;
  scene.add(plate);

  // Ruler ticks every cm along one edge (visual scale reference)
  const rulerGroup = new THREE.Group();
  for (let cm = 0; cm <= 12; cm++) {
    const tall = cm % 5 === 0;
    const tick = new THREE.Mesh(
      new THREE.BoxGeometry(0.0015, tall ? 0.006 : 0.003, 0.0015),
      new THREE.MeshStandardMaterial({ color: 0x8a7a68 })
    );
    tick.position.set(-0.1 + cm * 0.01, tall ? 0.003 : 0.0015, 0.12);
    rulerGroup.add(tick);
  }
  const rail = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.0015, 0.0015),
    new THREE.MeshStandardMaterial({ color: 0x8a7a68 })
  );
  rail.position.set(-0.04, 0, 0.12);
  rulerGroup.add(rail);
  scene.add(rulerGroup);

  previewBurger = buildBurger();
  scene.add(previewBurger);

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
}

// ---------- AR mode ----------
let reticle, hitTestSource = null, hitTestSourceRequested = false;
let placedBurger = null;

function setupAR() {
  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.045, 0.05, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xe3672b })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  const arButton = ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: document.body }
  });
  arButton.style.display = 'none';
  document.body.appendChild(arButton);

  mainBtn.disabled = false;
  mainBtn.textContent = 'Ver em AR';
  msg.innerHTML = 'Toque no botão, aponte para uma <b>mesa ou chão</b> e depois toque na tela para posicionar o lanche em tamanho real.';

  mainBtn.addEventListener('click', () => arButton.click());

  renderer.xr.addEventListener('sessionstart', () => {
    document.getElementById('panel').style.display = 'none';
    document.querySelector('header.top').style.display = 'none';
    hint.style.display = 'block';
  });
  renderer.xr.addEventListener('sessionend', () => {
    document.getElementById('panel').style.display = 'flex';
    document.querySelector('header.top').style.display = 'block';
    hint.style.display = 'none';
    resetBtn.style.display = 'none';
    if (placedBurger) { scene.remove(placedBurger); placedBurger = null; }
    hitTestSourceRequested = false;
    hitTestSource = null;
  });

  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', () => {
    if (!reticle.visible) return;
    if (placedBurger) scene.remove(placedBurger);
    placedBurger = buildBurger();
    placedBurger.position.setFromMatrixPosition(reticle.matrix);
    placedBurger.quaternion.setFromRotationMatrix(reticle.matrix);
    scene.add(placedBurger);
    resetBtn.style.display = 'flex';
    hint.textContent = 'Ande ao redor para ver o tamanho real de todos os ângulos';
  });
  scene.add(controller);

  resetBtn.addEventListener('click', () => {
    if (placedBurger) { scene.remove(placedBurger); placedBurger = null; }
    resetBtn.style.display = 'none';
    hint.textContent = 'Aponte para uma superfície plana e toque para posicionar';
  });

  renderer.setAnimationLoop((timestamp, frame) => {
    if (frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const session = renderer.xr.getSession();

      if (!hitTestSourceRequested) {
        session.requestReferenceSpace('viewer').then((viewerSpace) => {
          session.requestHitTestSource({ space: viewerSpace }).then((source) => {
            hitTestSource = source;
          });
        });
        session.addEventListener('end', () => {
          hitTestSourceRequested = false;
          hitTestSource = null;
        });
        hitTestSourceRequested = true;
      }

      if (hitTestSource) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          reticle.visible = true;
          reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
        } else {
          reticle.visible = false;
        }
      }
    }
    renderer.render(scene, camera);
  });
}

// ---------- Decide AR vs preview ----------
async function init() {
  const supportsAR = navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);

  if (supportsAR) {
    setupAR();
  } else {
    msg.innerHTML = 'Este navegador não suporta AR na web (comum em iPhones e em navegadores de desktop). Veja o modelo abaixo — arraste para girar. O prato branco tem <b>18 cm de diâmetro</b> e a régua mostra centímetros reais.';
    mainBtn.style.display = 'none';
    setupPreview();
  }
}

init();
</script>

</body>
</html>
